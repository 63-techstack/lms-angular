<div class="card shadow p-4">

  <h3 class="mb-4">Add Employee</h3>

  <form (ngSubmit)="saveEmployee()">

    <div class="row">

      <div class="col-md-6 mb-3">
        <label class="form-label">Name</label>

        <input type="text"
               [(ngModel)]="name"
               name="name"
               class="form-control"
               placeholder="Enter name">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Email</label>

        <input type="email"
               [(ngModel)]="email"
               name="email"
               class="form-control"
               placeholder="Enter email">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Phone</label>

        <input type="text"
               [(ngModel)]="phone"
               name="phone"
               class="form-control"
               placeholder="Enter phone">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Department</label>

        <input type="text"
               [(ngModel)]="department"
               name="department"
               class="form-control"
               placeholder="Enter department">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Salary</label>

        <input type="text"
               [(ngModel)]="salary"
               name="salary"
               class="form-control"
               placeholder="Enter salary">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Course</label>

        <select [(ngModel)]="selectedCourseId"
                name="courseId"
                class="form-select">

          <option value="">Select Course</option>

          <option *ngFor="let c of courses"
                  [value]="c.id">

            {{c.courseName}}

          </option>

        </select>
      </div>

    </div>

    <button type="submit"
            class="btn btn-success">
      Save Employee
    </button>

  </form>

  <p class="text-success mt-3">
    {{message}}
  </p>

</div>
