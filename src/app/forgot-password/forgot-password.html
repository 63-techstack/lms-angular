<div class="login-page">

  <div class="card login-card shadow mx-auto">

    <div class="login-logo">
      R
    </div>

    <h2 class="text-center mb-2">
      Reset Password
    </h2>

    <p class="text-center login-subtitle mb-4">
      Reset password using email OTP
    </p>

    <!-- Step 1: Email -->
    <div class="mb-3">

      <label class="form-label">
        Email
      </label>

      <input
        type="email"
        class="form-control"
        [(ngModel)]="email"
        name="email"
        placeholder="Enter registered email"
        [disabled]="otpSent"
        required>

    </div>

    @if (!otpSent) {

      <button
        type="button"
        class="btn btn-primary w-100 login-btn"
        (click)="sendOtp()">

        Send OTP

      </button>

    }

    <!-- Step 2: OTP -->
    @if (otpSent && !otpVerified) {

      <div class="mb-3 mt-3">

        <label class="form-label">
          OTP
        </label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="otp"
          name="otp"
          placeholder="Enter OTP"
          required>

      </div>

      <button
        type="button"
        class="btn btn-primary w-100 login-btn"
        (click)="verifyOtp()">

        Verify OTP

      </button>

    }

    <!-- Step 3: New Password -->
    @if (otpVerified) {

      <form (ngSubmit)="resetPassword()">

        <div class="mb-3 mt-3">

          <label class="form-label">
            New Password
          </label>

          <div class="password-box">

            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              [(ngModel)]="newPassword"
              name="newPassword"
              placeholder="Enter new password"
              required>

            <span
              class="eye-icon"
              (click)="showPassword = !showPassword">

              <i
                class="fa"
                [class.fa-eye]="!showPassword"
                [class.fa-eye-slash]="showPassword">
              </i>

            </span>

          </div>

          <small class="text-muted">
            Password must contain uppercase, lowercase,
            number & special character
          </small>

        </div>

        <div class="mb-4">

          <label class="form-label">
            Confirm Password
          </label>

          <div class="password-box">

            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              class="form-control"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm new password"
              required>

            <span
              class="eye-icon"
              (click)="showConfirmPassword = !showConfirmPassword">

              <i
                class="fa"
                [class.fa-eye]="!showConfirmPassword"
                [class.fa-eye-slash]="showConfirmPassword">
              </i>

            </span>

          </div>

        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 login-btn">

          Update Password

        </button>

      </form>

    }

    @if (message) {

      <p
        class="text-center mt-3 mb-0"
        [class.text-success]="
          message === 'OTP Sent Successfully' ||
          message === 'OTP Verified Successfully' ||
          message === 'Password Reset Successfully'
        "
        [class.text-danger]="
          message !== 'OTP Sent Successfully' &&
          message !== 'OTP Verified Successfully' &&
          message !== 'Password Reset Successfully'
        ">

        {{ message }}

      </p>

    }

    <div class="divider">
      <span>OR</span>
    </div>

    <button
      class="btn btn-outline-primary w-100 register-btn"
      routerLink="/">

      Back to Login

    </button>

  </div>

</div>
