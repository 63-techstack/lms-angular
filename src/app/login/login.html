<div class="container mt-5">

  <div class="card p-4 shadow w-50 mx-auto">

    <h2 class="text-center mb-4">LMS Login</h2>

    <form (ngSubmit)="loginUser()">

      <div class="mb-3">
        <label class="form-label">Username</label>

        <input type="text"
               [(ngModel)]="username"
               name="username"
               class="form-control"
               placeholder="Enter username">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>

        <input type="password"
               [(ngModel)]="password"
               name="password"
               class="form-control"
               placeholder="Enter password">
      </div>

      <button type="submit"
              class="btn btn-primary w-100">
        Login
      </button>

    </form>

    <p class="text-center text-danger mt-3">
      {{message}}
    </p>

  </div>

</div>
